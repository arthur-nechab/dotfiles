onboarding = false

[theme]
name = "terminal"

# Neutral greys only: the terminal palette paints selected rows white. Text colours follow the terminal theme.
[theme.custom]
overlay0 = "#665c54"
surface_dim = "#282828"
active_row_bg = "#3a3a3a"
selection_bg = "#4d4d4d"
# A named colour is an ANSI slot, so it follows the terminal theme; the default accent is ANSI blue.
accent = "gray"
# Inactive tab labels: ANSI gray, one step under the terminal foreground and still from the theme.
overlay1 = "gray"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
agent_panel_sort = "spaces"
tab_bar_right = [{ type = "zoom" }]
sidebar_width = 30
prompt_new_tab_name = false
pane_scrollbars = false
status_indicators = "symbols"

[ui.toast]
delivery = "terminal"
delay_seconds = 3

[ui.sidebar.spaces]
# Git status written by the sidebar plugin on the same row; empty for a clean default branch.
rows = [
  [
    "state_icon",
    "workspace",
    { token = "$git_clean", fg = "#8ec07c" },
    { token = "$git_dirty", fg = "#c78a1f" },
    { token = "$git_conflict", fg = "#e06c6c", bold = true },
  ],
]

[ui.sidebar.agents]
# Tokens written by the sidebar plugin. Sidebar cells take hex colours only.
rows = [
  [{ token = "$group", fg = "#a69e91", bold = true }, { token = "$group_alert", fg = "#e06c6c", bold = true }],
  [
    { token = "$line_working", fg = "#d97757", bold = true },
    { token = "$line_blocked", fg = "#e06c6c", bold = true },
    { token = "$line_done", fg = "#8ec07c", bold = true },
    { token = "$line_fresh", fg = "#8ec07c" },
    { token = "$line_idle", fg = "#887e72" },
    { token = "$line_unknown", fg = "#887e72" },
  ],
]

[keys]
last_pane = "prefix+tab"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+y"
type = "popup"
command = "yazi"
description = "open file browser"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+b"
type = "popup"
command = "$HOME/.config/herdr/scripts/beads-picker.sh"
description = "pick a bead"
width = "90%"
height = "80%"

# Alt + the AZERTY digit row focuses agent 1-9 of the panel; [keys.indexed] knows digits only.
[[keys.command]]
key = "alt+&"
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 1"
description = "focus agent 1"

[[keys.command]]
key = "alt+é"
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 2"
description = "focus agent 2"

[[keys.command]]
key = "alt+\""
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 3"
description = "focus agent 3"

[[keys.command]]
key = "alt+'"
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 4"
description = "focus agent 4"

[[keys.command]]
key = "alt+("
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 5"
description = "focus agent 5"

[[keys.command]]
key = "alt+minus"
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 6"
description = "focus agent 6"

[[keys.command]]
key = "alt+è"
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 7"
description = "focus agent 7"

[[keys.command]]
key = "alt+_"
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 8"
description = "focus agent 8"

[[keys.command]]
key = "alt+ç"
type = "shell"
command = "python3 $HOME/.config/herdr/sidebar/sidebar.py --focus 9"
description = "focus agent 9"
