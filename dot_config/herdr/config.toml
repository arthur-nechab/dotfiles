onboarding = false

[theme]
name = "terminal"

[theme.custom]
accent = "#ebdbb2"
overlay0 = "#665c54"
surface_dim = "#282828"
active_row_bg = "#3a3a3a"
selection_bg = "#4d4d4d"
text = "#ebdbb2"
subtext0 = "#bdae93"
red = "#fb4934"
yellow = "#fabd2f"
green = "#b8bb26"

[terminal]
new_cwd = "follow"

[worktrees]
directory = "~/.herdr/worktrees"

[ui]
agent_panel_sort = "priority"
tab_bar_right = [{ type = "zoom" }]
sidebar_width = 30
prompt_new_tab_name = false
pane_scrollbars = false

[ui.toast]
delivery = "terminal"
delay_seconds = 3

[ui.sound]
enabled = true

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace"],
  ["terminal_title_stripped"],
]

[keys]
last_pane = "prefix+tab"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+y"
type = "popup"
command = "yazi"
description = "open file browser"
width = "80%"
height = "80%"
