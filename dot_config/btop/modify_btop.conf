{{- /* chezmoi:modify-template */ -}}
{{- /* theme-from-wallpaper owns the color_theme line: keep the one already there */ -}}
{{- $theme := regexFind "(?m)^color_theme = \"[^\"]*\"" .chezmoi.stdin -}}
{{- $base := includeTemplate "btop.conf" . -}}
{{- if $theme }}{{ regexReplaceAll "(?m)^color_theme = \"[^\"]*\"" $base $theme }}{{ else }}{{ $base }}{{ end -}}
