[mgr]
sort_by = "natural"
sort_dir_first = true
show_hidden = true
linemode = "size"

[preview]
wrap = "yes"
tab_size = 2
image_quality = 80

[plugin]
prepend_preloaders = [
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
]
prepend_previewers = [
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
]
